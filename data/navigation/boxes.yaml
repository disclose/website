# Homepage feature boxes - Problem-Solution framing

- title: "I want to accept security reports"
  description: "Launch a VDP that researchers trust. Policymaker generates everything you need: safe harbor language, security.txt, and disclose.io-compliant policies."
  icon: "pencil"
  url: "https://policymaker.disclose.io"

- title: "I found a vulnerability"
  description: "Look up who to report to. Lookup resolves any asset to its security contact, disclosure program, and safe harbor status, and helps you navigate the process."
  icon: "search"
  url: "https://lookup.disclose.io"

- title: "I'm researching a program"
  description: "Browse the open directory of every known vulnerability disclosure and bug bounty program, with scope, policy URLs, and safe-harbor language."
  icon: "menu"
  url: "https://directory.disclose.io"

- title: "I want to protect researchers"
  description: "Access model policies, legal frameworks, and safe harbor guidance. Help advance the legal protections security researchers need."
  icon: "shield"
  url: "/docs/key-objectives/"
