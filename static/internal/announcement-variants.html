<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Announcement variants: disclose.io internal</title>
<link rel="stylesheet" href="/css/site.css">
<style>
  body { background: #f8fafc; }
  .frame-phone { width: 375px; max-width: 100%; border: 1px solid #e5e7eb; border-radius: 14px; overflow: hidden; background: #fff; }
  .frame-wide { border: 1px solid #e5e7eb; border-radius: 14px; overflow: hidden; background: #fff; }
  .fake-nav { height: 52px; border-top: 1px solid #e5e7eb; display: flex; align-items: center; padding: 0 16px; gap: 10px; }
  .fake-nav span { height: 10px; border-radius: 999px; background: #e2e8f0; }
</style>
</head>
<body class="font-sans text-gray-700 antialiased">
<main class="max-w-6xl mx-auto px-4 py-10">
  <span class="eyebrow">Internal review</span>
  <h1 class="text-3xl font-bold text-gray-900 mb-2">Top 100 announcement: shorter variations</h1>
  <p class="text-gray-600 mb-2 max-w-3xl">All in deep purple (#4c1d95) with white text. Each is shown full width and in a 375px phone frame. The current live version is at the bottom for comparison.</p>
  <p class="text-gray-600 mb-10 max-w-3xl">Reply with a letter to ship it to dev.disclose.io.</p>

  <div id="variants" class="space-y-12"></div>
</main>

<template id="tpl-A">
  <div class="on-dark bg-purple-dark text-white text-sm">
    <div class="px-4 py-2.5 flex items-center gap-3">
      <span class="shrink-0 rounded-full bg-white px-2 py-0.5 text-[11px] font-bold uppercase tracking-[0.12em] text-purple-dark">New</span>
      <p class="flex-1 min-w-0"><a href="https://state.disclose.io/top-100/" class="font-semibold text-white hover:underline">The safe-harbor scoreboard is live.</a>
        <a href="https://state.disclose.io/top-100/" class="ml-1 whitespace-nowrap font-semibold text-white underline underline-offset-2 hover:no-underline">See the Top 100 <span aria-hidden="true">&rarr;</span></a></p>
      <button type="button" class="shrink-0 rounded-full p-1.5 text-white hover:bg-white/15" aria-label="Dismiss announcement"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"/></svg></button>
    </div>
  </div>
</template>

<template id="tpl-B">
  <div class="on-dark bg-purple-dark text-white text-sm relative">
    <a href="https://state.disclose.io/top-100/" class="block px-12 py-2.5 text-center font-semibold text-white hover:underline">New: the Top 100 safe-harbor scoreboard <span aria-hidden="true">&rarr;</span></a>
    <button type="button" class="absolute right-3 top-1/2 -translate-y-1/2 rounded-full p-1.5 text-white hover:bg-white/15" aria-label="Dismiss announcement"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"/></svg></button>
  </div>
</template>

<template id="tpl-C">
  <div class="on-dark bg-purple-dark text-white text-sm">
    <div class="px-4 py-2.5 flex items-center gap-3">
      <p class="flex-1 min-w-0">How do the world's biggest companies grade on safe harbor?
        <a href="https://state.disclose.io/top-100/" class="ml-1 whitespace-nowrap font-semibold text-white underline underline-offset-2 hover:no-underline">See the scoreboard <span aria-hidden="true">&rarr;</span></a></p>
      <button type="button" class="shrink-0 rounded-full p-1.5 text-white hover:bg-white/15" aria-label="Dismiss announcement"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"/></svg></button>
    </div>
  </div>
</template>

<template id="tpl-D">
  <div class="on-dark bg-purple-dark text-white text-sm">
    <div class="px-4 py-2.5 flex items-center justify-center gap-3">
      <span class="shrink-0 rounded-full bg-white px-2 py-0.5 text-[11px] font-bold uppercase tracking-[0.12em] text-purple-dark">New</span>
      <a href="https://state.disclose.io/top-100/" class="font-semibold text-white hover:underline whitespace-nowrap">Top 100 scoreboard <span aria-hidden="true">&rarr;</span></a>
    </div>
  </div>
</template>

<template id="tpl-E">
  <div class="on-dark bg-purple-dark text-white text-[13px] relative">
    <a href="https://state.disclose.io/top-100/" class="block px-10 py-2 text-center text-white hover:underline">Who has safe harbor? <span class="font-semibold underline underline-offset-2">See the Top 100</span> <span aria-hidden="true">&rarr;</span></a>
    <button type="button" class="absolute right-2 top-1/2 -translate-y-1/2 rounded-full p-1 text-white hover:bg-white/15" aria-label="Dismiss announcement"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"/></svg></button>
  </div>
</template>

<template id="tpl-NOW">
  <div class="on-dark bg-purple-dark text-white text-sm">
    <div class="px-4 py-2.5 flex items-center gap-3">
      <span class="shrink-0 rounded-full bg-white px-2 py-0.5 text-[11px] font-bold uppercase tracking-[0.12em] text-purple-dark">New</span>
      <p class="flex-1 min-w-0 text-white"><a href="https://state.disclose.io/top-100/" class="font-semibold text-white hover:underline">The safe-harbor scoreboard is live.</a>
        <span class="text-white"> See how the Fortune 100, ASX 100, FTSE 100, Nasdaq-100 and US governments grade on the disclose.io maturity model.</span>
        <a href="https://state.disclose.io/top-100/" class="ml-1 whitespace-nowrap font-semibold text-white underline underline-offset-2 hover:no-underline">See the Top 100 <span aria-hidden="true">&rarr;</span></a></p>
      <button type="button" class="shrink-0 rounded-full p-1.5 text-white hover:bg-white/15" aria-label="Dismiss announcement"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"/></svg></button>
    </div>
  </div>
</template>

<script>
  const variants = [
    ["A", "Short line", "Headline and link only; drops the list of indexes. Keeps the NEW badge and dismiss."],
    ["B", "One centered link", "The whole bar is a single link. Quietest option that still reads as an announcement."],
    ["C", "Question hook", "Leads with the question the scoreboard answers. No badge."],
    ["D", "Badge and label", "Smallest footprint: NEW plus 'Top 100 scoreboard'. No dismiss button (it is short enough to live with)."],
    ["E", "Slim question", "Thinner bar (13px text), short question, underlined call to action."],
    ["NOW", "Current live version", "For comparison: the version on dev.disclose.io today."],
  ];
  const host = document.getElementById("variants");
  for (const [id, name, note] of variants) {
    const tpl = document.getElementById("tpl-" + id);
    const sec = document.createElement("section");
    sec.innerHTML = `<div class="flex items-baseline gap-3 mb-1"><span class="eyebrow !mb-0">${id === "NOW" ? "Current" : "Variant " + id}</span><h2 class="text-xl font-bold text-gray-900">${name}</h2></div><p class="text-gray-600 text-sm mb-4">${note}</p>
      <div class="grid gap-6 lg:grid-cols-[1fr_375px] items-start">
        <div><div class="text-[11px] font-bold uppercase tracking-[0.14em] text-gray-600 mb-2">Desktop</div><div class="frame-wide" data-slot="wide"></div></div>
        <div><div class="text-[11px] font-bold uppercase tracking-[0.14em] text-gray-600 mb-2">Phone, 375px</div><div class="frame-phone" data-slot="phone"></div></div>
      </div>`;
    for (const slot of sec.querySelectorAll("[data-slot]")) {
      slot.appendChild(tpl.content.cloneNode(true));
      const nav = document.createElement("div"); nav.className = "fake-nav";
      nav.innerHTML = '<span style="width:80px"></span><span style="width:56px"></span><span style="width:64px"></span>';
      slot.appendChild(nav);
    }
    host.appendChild(sec);
  }
</script>
</body>
</html>
