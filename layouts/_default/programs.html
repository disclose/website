{{ define "main" }}
<section class="section-sm">
  <div class="container-wide">
    {{/* Header */}}
    <header class="mb-8 text-center">
      <h1 class="text-3xl md:text-4xl font-display font-bold mb-4">{{ .Title }}</h1>
      {{ with .Params.description }}
      <p class="text-xl text-gray-600 max-w-2xl mx-auto mb-3">{{ . }}</p>
      {{ end }}
    </header>

    {{/* Vultron Directory Widget */}}
    <div id="vultron-directory"></div>
    <script>
    (function(w,d,s,o,f,js,fjs){
      w[o]=w[o]||function(){(w[o].q=w[o].q||[]).push(arguments)};
      js=d.createElement(s);fjs=d.getElementsByTagName(s)[0];
      js.id=o;js.src=f;js.async=1;fjs.parentNode.insertBefore(js,fjs);
    })(window,document,'script','VultronDirectory','https://widgets.vultron.io/directory.js');

    VultronDirectory('init', { directoryId: 'adf701' });
    </script>
  </div>
</section>
{{ end }}
