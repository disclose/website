{{ define "main" }}
<section class="section">
  <div class="container-narrow text-center">
    <div class="py-16">
      <h1 class="text-9xl font-display font-bold text-purple mb-4">404</h1>
      <h2 class="text-3xl font-display font-bold text-gray-900 mb-4">Page Not Found</h2>
      <p class="text-xl text-gray-600 mb-8">
        Oops! The page you're looking for doesn't exist or has been moved.
      </p>
      <div class="flex flex-col sm:flex-row gap-4 justify-center">
        <a href="{{ "/" | relURL }}" class="btn btn-primary">
          Go Home
        </a>
        <a href="{{ "/docs/" | relURL }}" class="btn btn-secondary">
          Browse Docs
        </a>
      </div>
    </div>
  </div>
</section>
{{ end }}
