{{/* Mobile menu overlay */}}
<div x-show="mobileMenuOpen"
     x-transition:enter="transition ease-out duration-300"
     x-transition:enter-start="opacity-0"
     x-transition:enter-end="opacity-100"
     x-transition:leave="transition ease-in duration-200"
     x-transition:leave-start="opacity-100"
     x-transition:leave-end="opacity-0"
     class="fixed inset-0 z-40 bg-black/50 md:hidden"
     @click="mobileMenuOpen = false"
     style="display: none;"></div>

{{/* Mobile menu panel */}}
<div x-show="mobileMenuOpen"
     x-transition:enter="transition ease-out duration-300"
     x-transition:enter-start="translate-x-full"
     x-transition:enter-end="translate-x-0"
     x-transition:leave="transition ease-in duration-200"
     x-transition:leave-start="translate-x-0"
     x-transition:leave-end="translate-x-full"
     class="fixed inset-y-0 right-0 z-50 w-full max-w-sm bg-white shadow-xl md:hidden"
     style="display: none;">
  <div class="flex flex-col h-full">
    {{/* Header */}}
    <div class="flex items-center justify-between p-4 border-b border-shade-200">
      <a href="{{ "/" | relURL }}" class="flex items-center">
        <img src="{{ "uploads/logo.svg" | relURL }}" alt="{{ .Site.Title }}" class="h-8 w-auto">
      </a>
      <button @click="mobileMenuOpen = false" class="p-2 text-gray-600 hover:text-gray-900" aria-label="Close menu">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>

    {{/* Search */}}
    {{ if .Site.Params.enable_search }}
    <div class="p-4 border-b border-shade-200">
      <div id="mobile-search"></div>
      <script>
        window.addEventListener('DOMContentLoaded', function() {
          if (document.getElementById('mobile-search')) {
            new PagefindUI({
              element: "#mobile-search",
              showSubResults: false,
              showImages: false
            });
          }
        });
      </script>
    </div>
    {{ end }}

    {{/* Navigation */}}
    <nav class="flex-1 overflow-y-auto p-4">
      <ul class="space-y-1">
        {{ range .Site.Menus.main }}
        <li>
          <a href="{{ .URL }}"
             @click="mobileMenuOpen = false"
             class="block py-3 px-4 text-gray-700 hover:bg-shade-050 rounded-lg transition-colors{{ if $.IsMenuCurrent "main" . }} bg-purple/10 text-purple font-medium{{ end }}"
             {{ if strings.HasPrefix .URL "http" }}target="_blank" rel="noopener noreferrer"{{ end }}>
            {{ .Name }}
          </a>
        </li>
        {{ end }}
      </ul>
    </nav>

    {{/* Footer */}}
    <div class="p-4 border-t border-shade-200 bg-shade-050">
      <div class="flex justify-center space-x-6">
        <a href="https://github.com/disclose" class="text-gray-500 hover:text-purple" target="_blank" rel="noopener noreferrer" aria-label="GitHub">
          <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
            <path fill-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" clip-rule="evenodd"/>
          </svg>
        </a>
        <a href="https://twitter.com/disaborcloseio" class="text-gray-500 hover:text-purple" target="_blank" rel="noopener noreferrer" aria-label="Twitter">
          <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
            <path d="M8.29 20.251c7.547 0 11.675-6.253 11.675-11.675 0-.178 0-.355-.012-.53A8.348 8.348 0 0022 5.92a8.19 8.19 0 01-2.357.646 4.118 4.118 0 001.804-2.27 8.224 8.224 0 01-2.605.996 4.107 4.107 0 00-6.993 3.743 11.65 11.65 0 01-8.457-4.287 4.106 4.106 0 001.27 5.477A4.072 4.072 0 012.8 9.713v.052a4.105 4.105 0 003.292 4.022 4.095 4.095 0 01-1.853.07 4.108 4.108 0 003.834 2.85A8.233 8.233 0 012 18.407a11.616 11.616 0 006.29 1.84"/>
          </svg>
        </a>
      </div>
    </div>
  </div>
</div>
