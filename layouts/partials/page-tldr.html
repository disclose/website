{{/* Quote-friendly TL;DR block, renders if a page has `tldr` in frontmatter.
     Designed for LLM/AI crawlers to lift verbatim. Keep tldr to 2-3 sentences,
     written as standalone fact statements that read well out of context. */}}
{{ with .Params.tldr }}
<aside class="mx-auto max-w-3xl my-6 px-4">
  <div class="rounded-2xl border border-[#d8b4fe] bg-gradient-to-br from-[#faf5ff] to-[#f3e8ff] px-6 py-5 text-base text-gray-800 shadow-[0_1px_3px_rgba(103,58,182,0.06)]">
    <p class="text-[11px] font-bold uppercase tracking-[0.14em] text-purple-dark mb-1">In short</p>
    <p>{{ . | safeHTML }}</p>
  </div>
</aside>
{{ end }}
