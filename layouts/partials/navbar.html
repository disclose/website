<header class="bg-white border-b border-shade-200 sticky top-0 z-50">
  <nav class="container-wide">
    <div class="flex items-center justify-between h-16">
      {{/* Logo */}}
      <div class="flex items-center">
        <a href="{{ "/" | relURL }}" class="flex items-center">
          <img src="{{ "uploads/logo.svg" | relURL }}" alt="{{ .Site.Title }}" class="h-8 w-auto">
        </a>
      </div>

      {{/* Desktop Navigation */}}
      <div class="hidden md:flex items-center space-x-8">
        {{ range .Site.Menus.main }}
        <a href="{{ .URL }}"
           class="nav-link text-sm font-medium{{ if $.IsMenuCurrent "main" . }} nav-link-active{{ end }}"
           {{ if strings.HasPrefix .URL "http" }}target="_blank" rel="noopener noreferrer"{{ end }}>
          {{ .Name }}
        </a>
        {{ end }}

        {{/* Search toggle */}}
        {{ if .Site.Params.enable_search }}
        <button @click="searchOpen = !searchOpen" class="nav-link p-2" aria-label="Search">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
        </button>
        {{ end }}
      </div>

      {{/* Mobile menu button */}}
      <div class="md:hidden">
        <button @click="mobileMenuOpen = !mobileMenuOpen" class="p-2 text-gray-600 hover:text-gray-900" aria-label="Menu">
          <svg x-show="!mobileMenuOpen" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
          </svg>
          <svg x-show="mobileMenuOpen" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="display: none;">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>
    </div>

    {{/* Search dropdown */}}
    {{ if .Site.Params.enable_search }}
    <div x-show="searchOpen"
         x-transition:enter="transition ease-out duration-200"
         x-transition:enter-start="opacity-0 -translate-y-2"
         x-transition:enter-end="opacity-100 translate-y-0"
         x-transition:leave="transition ease-in duration-150"
         x-transition:leave-start="opacity-100 translate-y-0"
         x-transition:leave-end="opacity-0 -translate-y-2"
         @click.outside="searchOpen = false"
         class="absolute left-0 right-0 bg-white border-b border-shade-200 p-4"
         style="display: none;">
      <div class="container-wide">
        <div id="search" class="max-w-2xl mx-auto"></div>
        <script>
          window.addEventListener('DOMContentLoaded', function() {
            new PagefindUI({
              element: "#search",
              showSubResults: true,
              showImages: false
            });
          });
        </script>
      </div>
    </div>
    {{ end }}
  </nav>
</header>
