{{/* Hero section for homepage - white background like production */}}
{{ with .Params.hero }}
<section class="bg-white py-16">
  <div class="container-wide">
    <div class="max-w-4xl mx-auto text-center">
      {{/* Logo/Image */}}
      {{ with .image }}
      <div class="mb-8">
        <img src="{{ . | relURL }}" alt="disclose.io" class="max-w-5xl w-full mx-auto">
      </div>
      {{ end }}

      {{/* Title */}}
      <h1 class="text-4xl md:text-5xl lg:text-6xl font-display font-bold mb-6 text-purple">
        {{ .title }}
      </h1>

      {{/* Subtitle */}}
      {{ with .subtitle }}
      <p class="text-xl md:text-2xl text-gray-600 mb-8 max-w-3xl mx-auto">
        {{ . }}
      </p>
      {{ end }}
    </div>
  </div>
</section>
{{ end }}
