version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      all-deps:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      # Majors in one PR too. Twelve individual bumps sat open from July to November
      # because each major arrived alone; one grouped PR per ecosystem is reviewable.
      all-deps-major:
        patterns:
          - "*"
        update-types:
          - major
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      all-deps:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      all-deps-major:
        patterns:
          - "*"
        update-types:
          - major
